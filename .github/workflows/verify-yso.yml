name: Verify Yso
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build verified Lua 5.4.8 tools
        run: ./Ysindrolir/scripts/setup_ci_lua.ps1
      - name: Run unified verification
        run: ./Ysindrolir/scripts/verify_yso.ps1 -OutputDirectory "$env:RUNNER_TEMP/yso-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yso-verification
          path: ${{ runner.temp }}/yso-results
